apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "30s"
            - name: OLLAMA_NUM_CTX
              value: "2048"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          resources:
            # Measured 2026-11-08: minicpm5-nothink-q8 peaks at ~3.2Gi with the
            # default 2048-token context. 4Gi got llama-server OOM-killed three
            # times on 2026-10-21; 6Gi leaves room for longer contexts.
            limits:
              memory: 6Gi
              cpu: "4"
            requests:
              memory: 2Gi
              cpu: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          startupProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 120
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path
